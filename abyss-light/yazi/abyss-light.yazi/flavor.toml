symlink_target = { italic = true }
marker_copied = { fg = "#083f68", bg = "#083f68" }
marker_cut = { fg = "#a06002", bg = "#a06002" }
marker_marked = { fg = "#0972d2", bg = "#0972d2" }
marker_selected = { fg = "#956a09", bg = "#956a09" }
