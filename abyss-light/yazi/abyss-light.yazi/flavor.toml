  { mime = "image/*", fg = "#026d44" },
  { mime = "{audio,video}/*", fg = "#8c2369" },
  { mime = "application/*zip", fg = "#a06002" },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#a06002" },
  { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#906a00" },
  { url = "*", fg = "#1f2329" },
  { url = "*/", fg = "#0972d2" },
