# Haze: Soft, slightly warm grey with dusty accents. The lowest-contrast scheme of the set.
# Generated by colorscheme-tools v0.1.0 from haze/colorschemes.json. Do not edit.
# Usage: install haze.yazi under yazi/flavors and select it in theme.toml

[mgr]
cwd = { fg = "#9ecfff" }
find_keyword = { fg = "#f4da9b", bold = true, italic = true, underline = true }
find_position = { fg = "#bb8cab", bg = "#2d2f33", bold = true, italic = true }
symlink_target = { italic = true }
marker_copied = { fg = "#6686b9", bg = "#6686b9" }
marker_cut = { fg = "#d0a771", bg = "#d0a771" }
marker_marked = { fg = "#9ecfff", bg = "#9ecfff" }
marker_selected = { fg = "#f4da9b", bg = "#f4da9b" }
count_copied = { fg = "#2d2f33", bg = "#6686b9" }
count_cut = { fg = "#2d2f33", bg = "#d0a771" }
count_selected = { fg = "#2d2f33", bg = "#f4da9b" }
border_symbol = "│"
border_style = { fg = "#4a4c51" }

[tabs]
active = { fg = "#2d2f33", bg = "#9ecfff" }
inactive = { fg = "#94928c", bg = "#35373c" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#2d2f33", bg = "#9ecfff", bold = true }
normal_alt = { fg = "#9ecfff", bg = "#35373c" }
select_main = { fg = "#2d2f33", bg = "#f4da9b", bold = true }
select_alt = { fg = "#94928c", bg = "#35373c" }
unset_main = { fg = "#2d2f33", bg = "#6686b9", bold = true }
unset_alt = { fg = "#94928c", bg = "#35373c" }

[indicator]
parent = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "█", close = "█" }

[status]
overall = { }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_sep = { fg = "#4a4c51" }
perm_type = { fg = "#739b69" }
perm_read = { fg = "#6686b9" }
perm_write = { fg = "#ddc0d8" }
perm_exec = { fg = "#6686b9" }
progress_label = { fg = "#c0bdb5", bold = true }
progress_normal = { fg = "#9ecfff", bg = "#35373c" }
progress_error = { fg = "#a47c63", bg = "#35373c" }

[which]
cols = 3
mask = { bg = "#35373c" }
cand = { fg = "#9ecfff" }
rest = { fg = "#94928c" }
desc = { fg = "#e2c88a" }
separator = "  "
separator_style = { fg = "#4a4c51" }

[confirm]
border = { fg = "#4a4c51" }
title = { fg = "#9ecfff" }
body = { fg = "#c0bdb5" }
list = { fg = "#c0bdb5" }
btn_yes = { reversed = true, fg = "#c0bdb5" }
btn_no = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border = { fg = "#4a4c51" }
title = { fg = "#9ecfff" }
tbl_col = { fg = "#9ecfff" }
tbl_cell = { fg = "#f4da9b", reversed = true }

[notify]
title_info = { fg = "#6f99c9" }
title_warn = { fg = "#f4da9b" }
title_error = { fg = "#a47c63" }

[pick]
border = { fg = "#4a4c51" }
active = { fg = "#9ecfff", bold = true }
inactive = {}

[input]
border = { fg = "#4a4c51" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#4a4c51" }
active = { reversed = true, fg = "#9ecfff" }
inactive = { fg = "#c0bdb5" }

[tasks]
border = { fg = "#4a4c51" }
title = {}
hovered = { underline = true }

[help]
border = { fg = "#4a4c51" }
chord = { fg = "#9ecfff" }
action = {}
hovered = { reversed = true, bold = true }

[filetype]
rules = [
  { mime = "image/*", fg = "#739b69" },
  { mime = "{audio,video}/*", fg = "#bb8cab" },
  { mime = "application/*zip", fg = "#d0a771" },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#d0a771" },
  { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#e2c88a" },
  { url = "*", fg = "#c0bdb5" },
  { url = "*/", fg = "#9ecfff" },
]
