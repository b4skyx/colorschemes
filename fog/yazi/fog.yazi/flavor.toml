# Fog: Muted, low-contrast grey-blue with pastel accents that rely on lightness steps more than saturation.
# Generated by colorscheme-tools v0.1.0 from fog/colorschemes.json. Do not edit.
# Usage: install fog.yazi under yazi/flavors and select it in theme.toml

[mgr]
cwd = { fg = "#9ed1fc" }
find_keyword = { fg = "#dec88d", bold = true, italic = true, underline = true }
find_position = { fg = "#fdb9c4", bg = "#2a2c30", bold = true, italic = true }
symlink_target = { italic = true }
marker_copied = { fg = "#5e84b0", bg = "#5e84b0" }
marker_cut = { fg = "#cfa976", bg = "#cfa976" }
marker_marked = { fg = "#9ed1fc", bg = "#9ed1fc" }
marker_selected = { fg = "#dec88d", bg = "#dec88d" }
count_copied = { fg = "#2a2c30", bg = "#5e84b0" }
count_cut = { fg = "#2a2c30", bg = "#cfa976" }
count_selected = { fg = "#2a2c30", bg = "#dec88d" }
border_symbol = "│"
border_style = { fg = "#46484d" }

[tabs]
active = { fg = "#2a2c30", bg = "#9ed1fc" }
inactive = { fg = "#8c9199", bg = "#313338" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#2a2c30", bg = "#9ed1fc", bold = true }
normal_alt = { fg = "#9ed1fc", bg = "#313338" }
select_main = { fg = "#2a2c30", bg = "#dec88d", bold = true }
select_alt = { fg = "#8c9199", bg = "#313338" }
unset_main = { fg = "#2a2c30", bg = "#5e84b0", bold = true }
unset_alt = { fg = "#8c9199", bg = "#313338" }

[indicator]
parent = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "█", close = "█" }

[status]
overall = { }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_sep = { fg = "#46484d" }
perm_type = { fg = "#6d9673" }
perm_read = { fg = "#5e84b0" }
perm_write = { fg = "#d9c2dc" }
perm_exec = { fg = "#5e84b0" }
progress_label = { fg = "#b4b8bf", bold = true }
progress_normal = { fg = "#9ed1fc", bg = "#313338" }
progress_error = { fg = "#a17779", bg = "#313338" }

[which]
cols = 3
mask = { bg = "#313338" }
cand = { fg = "#9ed1fc" }
rest = { fg = "#8c9199" }
desc = { fg = "#cdb87d" }
separator = "  "
separator_style = { fg = "#46484d" }

[confirm]
border = { fg = "#46484d" }
title = { fg = "#9ed1fc" }
body = { fg = "#b4b8bf" }
list = { fg = "#b4b8bf" }
btn_yes = { reversed = true, fg = "#b4b8bf" }
btn_no = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border = { fg = "#46484d" }
title = { fg = "#9ed1fc" }
tbl_col = { fg = "#9ed1fc" }
tbl_cell = { fg = "#dec88d", reversed = true }

[notify]
title_info = { fg = "#6991be" }
title_warn = { fg = "#dec88d" }
title_error = { fg = "#a17779" }

[pick]
border = { fg = "#46484d" }
active = { fg = "#9ed1fc", bold = true }
inactive = {}

[input]
border = { fg = "#46484d" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#46484d" }
active = { reversed = true, fg = "#9ed1fc" }
inactive = { fg = "#b4b8bf" }

[tasks]
border = { fg = "#46484d" }
title = {}
hovered = { underline = true }

[help]
border = { fg = "#46484d" }
chord = { fg = "#9ed1fc" }
action = {}
hovered = { reversed = true, bold = true }

[filetype]
rules = [
  { mime = "image/*", fg = "#6d9673" },
  { mime = "{audio,video}/*", fg = "#fdb9c4" },
  { mime = "application/*zip", fg = "#cfa976" },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#cfa976" },
  { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#cdb87d" },
  { url = "*", fg = "#b4b8bf" },
  { url = "*/", fg = "#9ed1fc" },
]
