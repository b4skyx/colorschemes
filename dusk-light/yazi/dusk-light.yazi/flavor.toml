title_warn = { fg = "#976900" }
title_error = { fg = "#6f2436" }

[pick]
border = { fg = "#d5ccc6" }
active = { fg = "#b55264", bold = true }
inactive = {}

[input]
border = { fg = "#d5ccc6" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#d5ccc6" }
active = { reversed = true, fg = "#b55264" }
