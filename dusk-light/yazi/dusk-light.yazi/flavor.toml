# Dusk Light: Dusk on rose-tinted paper with teal, gold and lavender inks.
# Generated by colorscheme-tools v0.1.0 from dusk-light/colorschemes.json. Do not edit.
# Usage: install dusk-light.yazi under yazi/flavors and select it in theme.toml

[mgr]
cwd = { fg = "#b55264" }
find_keyword = { fg = "#976900", bold = true, italic = true, underline = true }
find_position = { fg = "#845ec1", bg = "#f7f1ec", bold = true, italic = true }
symlink_target = { italic = true }
marker_copied = { fg = "#224a4b", bg = "#224a4b" }
marker_cut = { fg = "#a16405", bg = "#a16405" }
marker_marked = { fg = "#b55264", bg = "#b55264" }
marker_selected = { fg = "#976900", bg = "#976900" }
count_copied = { fg = "#f7f1ec", bg = "#224a4b" }
count_cut = { fg = "#f7f1ec", bg = "#a16405" }
count_selected = { fg = "#f7f1ec", bg = "#976900" }
border_symbol = "│"
border_style = { fg = "#d5ccc6" }

[tabs]
active = { fg = "#f7f1ec", bg = "#b55264" }
inactive = { fg = "#797593", bg = "#efe6e0" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#f7f1ec", bg = "#b55264", bold = true }
normal_alt = { fg = "#b55264", bg = "#efe6e0" }
select_main = { fg = "#f7f1ec", bg = "#976900", bold = true }
select_alt = { fg = "#797593", bg = "#efe6e0" }
unset_main = { fg = "#f7f1ec", bg = "#224a4b", bold = true }
unset_alt = { fg = "#797593", bg = "#efe6e0" }

[indicator]
parent = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "█", close = "█" }

[status]
overall = { }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_sep = { fg = "#d5ccc6" }
perm_type = { fg = "#457b75" }
perm_read = { fg = "#224a4b" }
perm_write = { fg = "#815fc3" }
perm_exec = { fg = "#224a4b" }
progress_label = { fg = "#575279", bold = true }
progress_normal = { fg = "#b55264", bg = "#efe6e0" }
progress_error = { fg = "#6f2436", bg = "#efe6e0" }

[which]
cols = 3
mask = { bg = "#efe6e0" }
cand = { fg = "#b55264" }
rest = { fg = "#797593" }
desc = { fg = "#a16405" }
separator = "  "
separator_style = { fg = "#d5ccc6" }

[confirm]
border = { fg = "#d5ccc6" }
title = { fg = "#b55264" }
body = { fg = "#575279" }
list = { fg = "#575279" }
btn_yes = { reversed = true, fg = "#575279" }
btn_no = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border = { fg = "#d5ccc6" }
title = { fg = "#b55264" }
tbl_col = { fg = "#b55264" }
tbl_cell = { fg = "#976900", reversed = true }

[notify]
