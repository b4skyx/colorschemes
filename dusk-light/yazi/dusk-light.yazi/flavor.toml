[filetype]
rules = [
  { mime = "image/*", fg = "#457b75" },
  { mime = "{audio,video}/*", fg = "#845ec1" },
  { mime = "application/*zip", fg = "#a16405" },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#a16405" },
  { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#a16405" },
  { url = "*", fg = "#575279" },
  { url = "*/", fg = "#b55264" },
]
