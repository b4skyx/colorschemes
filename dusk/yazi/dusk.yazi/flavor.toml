# Dusk: Dusky violet with soft rose, gold, teal and lavender accents.
# Generated by colorscheme-tools v0.1.0 from dusk/colorschemes.json. Do not edit.
# Usage: install dusk.yazi under yazi/flavors and select it in theme.toml

[mgr]
cwd = { fg = "#fec8be" }
find_keyword = { fg = "#fdc67b", bold = true, italic = true, underline = true }
find_position = { fg = "#c9a7ff", bg = "#211e2c", bold = true, italic = true }
symlink_target = { italic = true }
marker_copied = { fg = "#1e91b9", bg = "#1e91b9" }
marker_cut = { fg = "#f6c177", bg = "#f6c177" }
marker_marked = { fg = "#fec8be", bg = "#fec8be" }
marker_selected = { fg = "#fdc67b", bg = "#fdc67b" }
count_copied = { fg = "#211e2c", bg = "#1e91b9" }
count_cut = { fg = "#211e2c", bg = "#f6c177" }
count_selected = { fg = "#211e2c", bg = "#fdc67b" }
border_symbol = "│"
border_style = { fg = "#3e3a4d" }

[tabs]
active = { fg = "#211e2c", bg = "#fec8be" }
inactive = { fg = "#9d97b5", bg = "#2a2638" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#211e2c", bg = "#fec8be", bold = true }
normal_alt = { fg = "#fec8be", bg = "#2a2638" }
select_main = { fg = "#211e2c", bg = "#fdc67b", bold = true }
select_alt = { fg = "#9d97b5", bg = "#2a2638" }
unset_main = { fg = "#211e2c", bg = "#1e91b9", bold = true }
unset_alt = { fg = "#9d97b5", bg = "#2a2638" }

[indicator]
parent = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "█", close = "█" }

[status]
overall = { }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_sep = { fg = "#3e3a4d" }
perm_type = { fg = "#88a69e" }
perm_read = { fg = "#1e91b9" }
perm_write = { fg = "#dfcefd" }
perm_exec = { fg = "#1e91b9" }
progress_label = { fg = "#dcd6ea", bold = true }
progress_normal = { fg = "#fec8be", bg = "#2a2638" }
progress_error = { fg = "#d46483", bg = "#2a2638" }

[which]
cols = 3
mask = { bg = "#2a2638" }
cand = { fg = "#fec8be" }
rest = { fg = "#9d97b5" }
desc = { fg = "#fdb843" }
separator = "  "
separator_style = { fg = "#3e3a4d" }

[confirm]
border = { fg = "#3e3a4d" }
title = { fg = "#fec8be" }
body = { fg = "#dcd6ea" }
list = { fg = "#dcd6ea" }
btn_yes = { reversed = true, fg = "#dcd6ea" }
btn_no = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border = { fg = "#3e3a4d" }
title = { fg = "#fec8be" }
tbl_col = { fg = "#fec8be" }
tbl_cell = { fg = "#fdc67b", reversed = true }

[notify]
title_info = { fg = "#a3d5dd" }
title_warn = { fg = "#fdc67b" }
title_error = { fg = "#d46483" }

[pick]
border = { fg = "#3e3a4d" }
active = { fg = "#fec8be", bold = true }
inactive = {}

[input]
border = { fg = "#3e3a4d" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#3e3a4d" }
active = { reversed = true, fg = "#fec8be" }
inactive = { fg = "#dcd6ea" }

[tasks]
border = { fg = "#3e3a4d" }
title = {}
hovered = { underline = true }

[help]
border = { fg = "#3e3a4d" }
chord = { fg = "#fec8be" }
action = {}
hovered = { reversed = true, bold = true }

[filetype]
rules = [
  { mime = "image/*", fg = "#88a69e" },
  { mime = "{audio,video}/*", fg = "#c9a7ff" },
  { mime = "application/*zip", fg = "#f6c177" },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#f6c177" },
  { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#fdb843" },
  { url = "*", fg = "#dcd6ea" },
  { url = "*/", fg = "#fec8be" },
]
