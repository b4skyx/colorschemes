[filetype]
rules = [
  { mime = "image/*", fg = "#316b47" },
  { mime = "{audio,video}/*", fg = "#8e5277" },
  { mime = "application/*zip", fg = "#976826" },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#976826" },
  { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#916e23" },
  { url = "*", fg = "#3d434b" },
  { url = "*/", fg = "#497ab1" },
