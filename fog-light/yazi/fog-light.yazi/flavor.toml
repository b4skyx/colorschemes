current = { reversed = true }
preview = { underline = true }
padding = { open = "█", close = "█" }

[status]
overall = { }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_sep = { fg = "#bfc3c8" }
perm_type = { fg = "#316b47" }
perm_read = { fg = "#164276" }
perm_write = { fg = "#956989" }
perm_exec = { fg = "#164276" }
progress_label = { fg = "#3d434b", bold = true }
progress_normal = { fg = "#497ab1", bg = "#d9dde2" }
progress_error = { fg = "#672f35", bg = "#d9dde2" }

[which]
