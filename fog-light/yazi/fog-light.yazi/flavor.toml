# Fog Light: Fog in daylight: cool grey-blue paper with muted ink accents that rely on lightness steps.
# Generated by colorscheme-tools v0.1.0 from fog-light/colorschemes.json. Do not edit.
# Usage: install fog-light.yazi under yazi/flavors and select it in theme.toml

[mgr]
cwd = { fg = "#497ab1" }
find_keyword = { fg = "#946f13", bold = true, italic = true, underline = true }
find_position = { fg = "#8e5277", bg = "#e4e7eb", bold = true, italic = true }
symlink_target = { italic = true }
marker_copied = { fg = "#164276", bg = "#164276" }
marker_cut = { fg = "#976826", bg = "#976826" }
marker_marked = { fg = "#497ab1", bg = "#497ab1" }
marker_selected = { fg = "#946f13", bg = "#946f13" }
count_copied = { fg = "#e4e7eb", bg = "#164276" }
count_cut = { fg = "#e4e7eb", bg = "#976826" }
count_selected = { fg = "#e4e7eb", bg = "#946f13" }
border_symbol = "│"
border_style = { fg = "#bfc3c8" }

[tabs]
active = { fg = "#e4e7eb", bg = "#497ab1" }
inactive = { fg = "#646b74", bg = "#d9dde2" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#e4e7eb", bg = "#497ab1", bold = true }
