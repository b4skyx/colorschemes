# Haze Light: Haze on warm paper: soft, low-contrast light grey with dusty ink accents.
# Generated by colorscheme-tools v0.1.0 from haze-light/colorschemes.json. Do not edit.
# Usage: install haze-light.yazi under yazi/flavors and select it in theme.toml

[mgr]
cwd = { fg = "#3f78b0" }
find_keyword = { fg = "#5b3c00", bold = true, italic = true, underline = true }
find_position = { fg = "#8d5577", bg = "#e8e5de", bold = true, italic = true }
symlink_target = { italic = true }
marker_copied = { fg = "#243f77", bg = "#243f77" }
marker_cut = { fg = "#9a6a1a", bg = "#9a6a1a" }
marker_marked = { fg = "#3f78b0", bg = "#3f78b0" }
marker_selected = { fg = "#5b3c00", bg = "#5b3c00" }
count_copied = { fg = "#e8e5de", bg = "#243f77" }
count_cut = { fg = "#e8e5de", bg = "#9a6a1a" }
count_selected = { fg = "#e8e5de", bg = "#5b3c00" }
border_symbol = "│"
border_style = { fg = "#c4c0b8" }

[tabs]
active = { fg = "#e8e5de", bg = "#3f78b0" }
inactive = { fg = "#6b6862", bg = "#dedad2" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#e8e5de", bg = "#3f78b0", bold = true }
normal_alt = { fg = "#3f78b0", bg = "#dedad2" }
select_main = { fg = "#e8e5de", bg = "#5b3c00", bold = true }
select_alt = { fg = "#6b6862", bg = "#dedad2" }
unset_main = { fg = "#e8e5de", bg = "#243f77", bold = true }
unset_alt = { fg = "#6b6862", bg = "#dedad2" }

[indicator]
parent = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "█", close = "█" }

[status]
overall = { }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_sep = { fg = "#c4c0b8" }
perm_type = { fg = "#334c00" }
perm_read = { fg = "#243f77" }
perm_write = { fg = "#98678a" }
perm_exec = { fg = "#243f77" }
progress_label = { fg = "#46443f", bold = true }
progress_normal = { fg = "#3f78b0", bg = "#dedad2" }
progress_error = { fg = "#a46471", bg = "#dedad2" }

[which]
cols = 3
mask = { bg = "#dedad2" }
cand = { fg = "#3f78b0" }
rest = { fg = "#6b6862" }
desc = { fg = "#906f23" }
separator = "  "
separator_style = { fg = "#c4c0b8" }

[confirm]
border = { fg = "#c4c0b8" }
title = { fg = "#3f78b0" }
body = { fg = "#46443f" }
list = { fg = "#46443f" }
btn_yes = { reversed = true, fg = "#46443f" }
btn_no = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border = { fg = "#c4c0b8" }
title = { fg = "#3f78b0" }
tbl_col = { fg = "#3f78b0" }
tbl_cell = { fg = "#5b3c00", reversed = true }

[notify]
title_info = { fg = "#3f6fa8" }
title_warn = { fg = "#5b3c00" }
title_error = { fg = "#a46471" }

[pick]
border = { fg = "#c4c0b8" }
active = { fg = "#3f78b0", bold = true }
inactive = {}

[input]
border = { fg = "#c4c0b8" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#c4c0b8" }
active = { reversed = true, fg = "#3f78b0" }
inactive = { fg = "#46443f" }

[tasks]
border = { fg = "#c4c0b8" }
title = {}
hovered = { underline = true }

[help]
border = { fg = "#c4c0b8" }
chord = { fg = "#3f78b0" }
action = {}
hovered = { reversed = true, bold = true }

[filetype]
rules = [
  { mime = "image/*", fg = "#334c00" },
  { mime = "{audio,video}/*", fg = "#8d5577" },
  { mime = "application/*zip", fg = "#9a6a1a" },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#9a6a1a" },
  { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#906f23" },
  { url = "*", fg = "#46443f" },
  { url = "*/", fg = "#3f78b0" },
]
