# Abyss: Near-black and OLED-friendly, with clear accents that stand out without glowing.
# Generated by colorscheme-tools v0.1.0 from abyss/colorschemes.json. Do not edit.
# Usage: install abyss.yazi under yazi/flavors and select it in theme.toml

[mgr]
cwd = { fg = "#569da4" }
find_keyword = { fg = "#fad54e", bold = true, italic = true, underline = true }
find_position = { fg = "#d7a2ff", bg = "#0e1014", bold = true, italic = true }
symlink_target = { italic = true }
marker_copied = { fg = "#1885e4", bg = "#1885e4" }
marker_cut = { fg = "#f0a742", bg = "#f0a742" }
marker_marked = { fg = "#569da4", bg = "#569da4" }
marker_selected = { fg = "#fad54e", bg = "#fad54e" }
count_copied = { fg = "#0e1014", bg = "#1885e4" }
count_cut = { fg = "#0e1014", bg = "#f0a742" }
count_selected = { fg = "#0e1014", bg = "#fad54e" }
border_symbol = "│"
border_style = { fg = "#282b30" }

[tabs]
active = { fg = "#0e1014", bg = "#569da4" }
inactive = { fg = "#80868f", bg = "#15181d" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#0e1014", bg = "#569da4", bold = true }
normal_alt = { fg = "#569da4", bg = "#15181d" }
select_main = { fg = "#0e1014", bg = "#fad54e", bold = true }
select_alt = { fg = "#80868f", bg = "#15181d" }
unset_main = { fg = "#0e1014", bg = "#1885e4", bold = true }
unset_alt = { fg = "#80868f", bg = "#15181d" }

[indicator]
parent = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "█", close = "█" }

[status]
overall = { }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_sep = { fg = "#282b30" }
perm_type = { fg = "#1ba871" }
perm_read = { fg = "#1885e4" }
perm_write = { fg = "#dfb8fe" }
perm_exec = { fg = "#1885e4" }
progress_label = { fg = "#c3c7ce", bold = true }
progress_normal = { fg = "#569da4", bg = "#15181d" }
progress_error = { fg = "#bd7761", bg = "#15181d" }

[which]
cols = 3
mask = { bg = "#15181d" }
cand = { fg = "#569da4" }
rest = { fg = "#80868f" }
desc = { fg = "#e6c77a" }
separator = "  "
separator_style = { fg = "#282b30" }

[confirm]
border = { fg = "#282b30" }
title = { fg = "#569da4" }
body = { fg = "#c3c7ce" }
list = { fg = "#c3c7ce" }
btn_yes = { reversed = true, fg = "#c3c7ce" }
btn_no = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border = { fg = "#282b30" }
title = { fg = "#569da4" }
tbl_col = { fg = "#569da4" }
tbl_cell = { fg = "#fad54e", reversed = true }

[notify]
title_info = { fg = "#59b0ff" }
title_warn = { fg = "#fad54e" }
title_error = { fg = "#bd7761" }

[pick]
border = { fg = "#282b30" }
active = { fg = "#569da4", bold = true }
inactive = {}

[input]
border = { fg = "#282b30" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#282b30" }
active = { reversed = true, fg = "#569da4" }
inactive = { fg = "#c3c7ce" }

[tasks]
border = { fg = "#282b30" }
title = {}
hovered = { underline = true }

[help]
border = { fg = "#282b30" }
chord = { fg = "#569da4" }
action = {}
hovered = { reversed = true, bold = true }

[filetype]
rules = [
  { mime = "image/*", fg = "#1ba871" },
  { mime = "{audio,video}/*", fg = "#d7a2ff" },
  { mime = "application/*zip", fg = "#f0a742" },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#f0a742" },
  { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#e6c77a" },
  { url = "*", fg = "#c3c7ce" },
  { url = "*/", fg = "#569da4" },
]
